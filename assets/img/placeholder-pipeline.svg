<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 533" width="800" height="533" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6f3ed"/>
      <stop offset="50%" stop-color="#eee9df"/>
      <stop offset="100%" stop-color="#e5dfd3"/>
    </linearGradient>

    <!-- Blueprint Grid -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#d5cebf" stroke-width="0.75" stroke-opacity="0.6"/>
      <path d="M 20 0 L 20 40 M 0 20 L 40 20" fill="none" stroke="#e4ded2" stroke-width="0.4" stroke-opacity="0.8"/>
    </pattern>

    <!-- Linear Pipe Gradient -->
    <linearGradient id="pipeMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a8b9e"/>
      <stop offset="25%" stop-color="#a4b3c4"/>
      <stop offset="50%" stop-color="#d4dee8"/>
      <stop offset="75%" stop-color="#7a8b9e"/>
      <stop offset="100%" stop-color="#4a5a6d"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1b1a18" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Base & Grid -->
  <rect width="800" height="533" fill="url(#bgGrad)"/>
  <rect width="800" height="533" fill="url(#gridPattern)"/>

  <!-- Technical Framing & Coordinate Borders -->
  <rect x="24" y="24" width="752" height="485" fill="none" stroke="#b8afa0" stroke-width="1.2" stroke-dasharray="8 4"/>
  <rect x="30" y="30" width="740" height="473" fill="none" stroke="#8a857c" stroke-width="0.6"/>

  <!-- Corner Registration Crosshairs -->
  <g stroke="#004de6" stroke-width="1.2">
    <path d="M 18 24 L 30 24 M 24 18 L 24 30"/>
    <path d="M 770 24 L 782 24 M 776 18 L 776 30"/>
    <path d="M 18 509 L 30 509 M 24 503 L 24 515"/>
    <path d="M 770 509 L 782 509 M 776 503 L 776 515"/>
  </g>

  <!-- Engineering CAD Schematic: Pipeline Trench & Transmission Network -->
  <g opacity="0.38" stroke="#1b1a18">
    <!-- Ground Profile Line -->
    <path d="M 50 160 Q 200 155 400 158 T 750 155" fill="none" stroke-width="1.8" stroke-dasharray="12 4"/>
    <text x="54" y="150" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#6b665c">NATURAL GROUND LEVEL (NGL)</text>

    <!-- Excavated Trench Profile -->
    <path d="M 100 160 L 150 360 L 650 360 L 700 160" fill="none" stroke="#8a857c" stroke-width="1.4" stroke-dasharray="4 2"/>
    <text x="160" y="380" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#6b665c">COMPACTED GRANULAR BEDDING</text>

    <!-- Main Water Pipeline Body -->
    <rect x="80" y="240" width="640" height="70" rx="6" fill="url(#pipeMetal)" stroke="#3a4856" stroke-width="1.8"/>

    <!-- Pipe Flange Joints -->
    <rect x="230" y="228" width="18" height="94" rx="3" fill="#586777" stroke="#2c3a47" stroke-width="1.2"/>
    <line x1="239" y1="232" x2="239" y2="318" stroke="#a4b3c4" stroke-width="1" stroke-dasharray="4 4"/>

    <rect x="520" y="228" width="18" height="94" rx="3" fill="#586777" stroke="#2c3a47" stroke-width="1.2"/>
    <line x1="529" y1="232" x2="529" y2="318" stroke="#a4b3c4" stroke-width="1" stroke-dasharray="4 4"/>

    <!-- Water Valve Chamber / Actuator Symbol -->
    <g transform="translate(380, 175)">
      <rect x="-12" y="0" width="24" height="65" fill="#4a5a6d" stroke="#1e293b" stroke-width="1.4"/>
      <circle cx="0" cy="-6" r="16" fill="#f6f3ed" stroke="#004de6" stroke-width="2"/>
      <line x1="-12" y1="-6" x2="12" y2="-6" stroke="#004de6" stroke-width="2"/>
      <line x1="0" y1="-18" x2="0" y2="6" stroke="#004de6" stroke-width="2"/>
      <text x="25" y="-2" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#004de6" font-weight="500">ISOLATION SLUICE VALVE</text>
    </g>

    <!-- Flow Direction Arrows -->
    <g fill="#004de6" opacity="0.6">
      <polygon points="170,270 155,263 155,277"/>
      <polygon points="320,270 305,263 305,277"/>
      <polygon points="610,270 595,263 595,277"/>
    </g>

    <!-- Dimension Callouts -->
    <line x1="80" y1="330" x2="720" y2="330" stroke="#8a857c" stroke-width="1" marker-start="url(#dot)" marker-end="url(#dot)"/>
    <text x="360" y="345" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#6b665c">TRANSMISSION FEEDER MAIN (DI / HDPE)</text>
  </g>

  <!-- Central Technical Placeholder Card Badge -->
  <g transform="translate(400, 266)" filter="url(#cardShadow)">
    <!-- Card Frame -->
    <rect x="-240" y="-120" width="480" height="240" rx="8" fill="#ffffff" fill-opacity="0.94" stroke="#d5cebf" stroke-width="1.5"/>
    <rect x="-234" y="-114" width="468" height="228" rx="6" fill="none" stroke="#004de6" stroke-width="0.8" stroke-opacity="0.3"/>

    <!-- Category Eyebrow Pill -->
    <g transform="translate(0, -78)">
      <rect x="-105" y="-13" width="210" height="26" rx="13" fill="#edf2f7" stroke="#cbd5e1" stroke-width="1"/>
      <circle cx="-85" cy="0" r="4" fill="#004de6"/>
      <text x="-72" y="4" font-family="'IBM Plex Mono', monospace" font-size="10.5" font-weight="600" fill="#0f172a" letter-spacing="1.2">WATER INFRASTRUCTURE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="-22" font-family="'Cormorant Garamond', Georgia, serif" font-size="28" font-weight="600" fill="#1b1a18" text-anchor="middle" letter-spacing="-0.02em">
      Pipelines &amp; Utility Schemes
    </text>

    <!-- Subtitle / Context -->
    <text x="0" y="10" font-family="'Inter', sans-serif" font-size="12" font-weight="400" fill="#524f49" text-anchor="middle" letter-spacing="0.01em">
      TWAD Board &amp; AMRUT 2.0 Potable Water Distribution Networks
    </text>

    <!-- Decorative Divider Line -->
    <line x1="-140" y1="34" x2="140" y2="34" stroke="#e2ded4" stroke-width="1"/>

    <!-- Status & Dimension Tag -->
    <g transform="translate(0, 68)">
      <!-- Camera / Blueprint Icon -->
      <g stroke="#004de6" stroke-width="1.6" fill="none" transform="translate(-165, -11)">
        <rect x="0" y="3" width="22" height="16" rx="2"/>
        <circle cx="11" cy="11" r="4.5"/>
        <path d="M 6 3 L 8 0 L 14 0 L 16 3"/>
      </g>
      <text x="-135" y="2" font-family="'IBM Plex Mono', monospace" font-size="10.5" font-weight="500" fill="#004de6" letter-spacing="0.5">
        PROJECT PHOTO PLACEHOLDER
      </text>
      <text x="145" y="2" font-family="'IBM Plex Mono', monospace" font-size="10.5" font-weight="400" fill="#8a857c" text-anchor="end">
        800 &times; 533 PX
      </text>
    </g>
  </g>

  <!-- Technical Footer Stamp -->
  <g transform="translate(48, 492)">
    <text x="0" y="0" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#8a857c" letter-spacing="0.8">
      ASHOK CONSTRUCTION &bull; CLASS 1 TWAD CONTRACTOR &bull; NAMAKKAL
    </text>
  </g>
  <g transform="translate(752, 492)">
    <text x="0" y="0" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#8a857c" text-anchor="end" letter-spacing="0.8">
      SEC-04 / PIPELINES
    </text>
  </g>
</svg>
